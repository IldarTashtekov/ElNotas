<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ElNotas</title>

    <!--
      La app se carga sin bundler: el JavaScript que emite `npm run build:web` en
      dist/web/, tal cual. Este mapa resuelve los alias entre módulos y tiene que
      calcar el campo "imports" de package.json.
    -->
    <script type="importmap">
      {
        "imports": {
          "#core/index": "/dist/web/core/index.js",
          "#storage/index": "/dist/web/storage/index.js",
          "#platform/index": "/dist/web/platform/index.js",
          "#ui/index": "/dist/web/ui/index.js"
        }
      }
    </script>
    <script type="module" src="/dist/web/platform/web/main.js"></script>

    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0 auto;
        max-width: 40rem;
        padding: 1rem;
      }
      button {
        font: inherit;
        white-space: nowrap;
      }
      .cabecera {
        align-items: center;
        display: flex;
        gap: 0.5rem;
      }
      .cabecera[hidden] {
        display: none;
      }
      .flecha {
        background: none;
        border: none;
        color: inherit;
        cursor: pointer;
        font-size: 1.25rem;
        padding: 0.5rem 0.75rem;
      }
      .titulo {
        flex: 1;
        font-size: 1.5rem;
        font-weight: bold;
        margin: 0;
        min-width: 0;
        overflow: hidden;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      input.titulo {
        font-family: inherit;
        padding: 0.25rem;
      }
      .titulo.renombrable {
        cursor: text;
      }
      .notas {
        list-style: none;
        padding: 0;
      }
      .notas li {
        border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent);
        padding: 0.75rem 0;
      }
      .vacia {
        text-align: center;
      }
      .vacia p {
        opacity: 0.6;
      }
      h2 {
        font-size: 1rem;
        margin: 1.5rem 0 0.5rem;
        opacity: 0.7;
        text-transform: uppercase;
      }
      .crear {
        display: flex;
        gap: 0.5rem;
      }
      .crear input {
        flex: 1;
        font: inherit;
        min-width: 0;
        padding: 0.5rem;
      }
      .crear button,
      .acciones button,
      .selector button,
      .vacia button,
      section > div > button {
        padding: 0.5rem 1rem;
      }
      .ajustes {
        list-style: none;
        padding: 0;
      }
      .ajustes > li {
        border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent);
        padding: 0.5rem 0;
      }
      ul.ajustes > li {
        align-items: center;
        display: flex;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .fila {
        background: none;
        border: none;
        color: inherit;
        cursor: pointer;
        padding: 0.25rem 0;
        text-align: left;
        width: 100%;
      }
      .acciones,
      .selector {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 0.5rem 0;
      }
      .secundario {
        opacity: 0.7;
      }
      .notas li {
        cursor: default;
        /* La pulsación larga es de la app: ni selección de texto ni el menú de iOS. */
        -webkit-touch-callout: none;
        touch-action: manipulation;
        user-select: none;
      }
      .notas li.seleccionada {
        background: color-mix(in srgb, #3b82f6 25%, transparent);
      }
      .mas {
        margin-top: 0.75rem;
        padding: 0.5rem 1rem;
      }
      .barra {
        align-items: center;
        background: Canvas;
        border-top: 1px solid color-mix(in srgb, currentColor 20%, transparent);
        bottom: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 0.75rem 0;
        position: sticky;
      }
      .barra[hidden] {
        display: none;
      }
      .barra > span {
        flex: 1;
      }
      .barra button {
        padding: 0.5rem 1rem;
      }
      .barra .selector {
        flex-basis: 100%;
      }
      .apagado {
        opacity: 0.3;
      }
      .vista-nota {
        display: flex;
        flex-direction: column;
        min-height: calc(100dvh - 2rem);
      }
      /* En una ventana, bajo la cabecera de la vista ventanas: se descuenta su alto. */
      .vista-nota.en-ventana {
        min-height: calc(100dvh - 5rem);
      }
      .vista-nota.en-ventana:empty {
        display: none;
      }
      .selector .grupo {
        flex-basis: 100%;
        font-size: 0.85rem;
        opacity: 0.7;
      }
      .contenido {
        flex: 1;
        padding: 0.5rem 0 1rem;
      }
      .linea {
        align-items: baseline;
        display: flex;
        flex-wrap: wrap;
        padding: 0.15rem 0;
      }
      .linea > .texto {
        flex: 1;
        min-height: 1.4em;
        min-width: 2rem;
        outline: none;
        padding: 0.15rem 0;
        tab-size: 4;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .linea > .texto:focus {
        background: color-mix(in srgb, currentColor 6%, transparent);
      }
      .marca {
        background: none;
        border: none;
        color: inherit;
        cursor: pointer;
        font-size: 1.1rem;
        padding: 0 0.5rem 0 0;
      }
      .linea.marcada > .texto {
        opacity: 0.6;
        text-decoration: line-through;
      }
      .hijas {
        flex-basis: 100%;
        padding-left: 1.5rem;
      }
      .empezar {
        cursor: text;
      }
      .barra-modo .salir {
        margin-left: auto;
      }
      .barra-modo button.activo {
        background: color-mix(in srgb, #3b82f6 45%, transparent);
        font-weight: bold;
      }
      .aviso {
        border: 1px solid #c77700;
        border-radius: 0.5rem;
        padding: 0 1rem;
      }
    </style>
  </head>
  <body>
    <main id="app"><p>Cargando…</p></main>
  </body>
</html>
