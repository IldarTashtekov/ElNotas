<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ElNotas</title>

    <!--
      La app se carga sin bundler: el JavaScript que emite `npm run build:web` en
      dist/web/, tal cual. Este mapa resuelve los alias entre módulos y tiene que
      calcar el campo "imports" de package.json.
    -->
    <script type="importmap">
      {
        "imports": {
          "#core/index": "/dist/web/core/index.js",
          "#storage/index": "/dist/web/storage/index.js",
          "#platform/index": "/dist/web/platform/index.js",
          "#ui/index": "/dist/web/ui/index.js"
        }
      }
    </script>
    <script type="module" src="/dist/web/platform/web/main.js"></script>

    <!--
      Los estilos, por vista, en src/ui/styles/. El orden importa: es el de la
      cascada, y una regla de un fichero puede ganar a otra de uno anterior.
    -->
    <link rel="stylesheet" href="/src/ui/styles/base.css" />
    <link rel="stylesheet" href="/src/ui/styles/ventanas.css" />
    <link rel="stylesheet" href="/src/ui/styles/ajustes.css" />
    <link rel="stylesheet" href="/src/ui/styles/hojas.css" />
    <link rel="stylesheet" href="/src/ui/styles/barras.css" />
    <link rel="stylesheet" href="/src/ui/styles/editor.css" />
  </head>
  <body>
    <main id="app"><p>Cargando…</p></main>
  </body>
</html>
