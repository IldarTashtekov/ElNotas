<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ElNotas</title>

    <!--
      La app se carga sin bundler: el JavaScript que emite `npm run build:web` en
      dist/web/, tal cual. Este mapa resuelve los alias entre módulos y tiene que
      calcar el campo "imports" de package.json.
    -->
    <script type="importmap">
      {
        "imports": {
          "#core/index": "/dist/web/core/index.js",
          "#storage/index": "/dist/web/storage/index.js",
          "#platform/index": "/dist/web/platform/index.js",
          "#ui/index": "/dist/web/ui/index.js"
        }
      }
    </script>
    <script type="module" src="/dist/web/platform/web/main.js"></script>

    <style>
      /* Los colores del boceto de vistas: claro y oscuro, con las fuentes del sistema. */
      :root {
        color-scheme: light;
        --ground: #e9edf2;
        --ink: #18202c;
        --muted: #667085;
        --line: #cdd4de;
        --screen: #ffffff;
        --row: #eef1f6;
        --rowline: #dce2ea;
        --accent: #3552d6;
        --accent-ink: #ffffff;
        --accent-soft: #e3e8fb;
        --green: #23915f;
        --danger: #cf3f37;
        --dim: #b7bfcc;
        --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --ground: #11151c;
          --ink: #e4e8ef;
          --muted: #98a2b3;
          --line: #2b3340;
          --screen: #1a2029;
          --row: #242b36;
          --rowline: #313a47;
          --accent: #6f88f5;
          --accent-ink: #0d1220;
          --accent-soft: #26304d;
          --green: #3dbb82;
          --danger: #f06a61;
          --dim: #4a5364;
        }
      }
      * {
        box-sizing: border-box;
      }
      /* «hidden» manda siempre, aunque una regla de abajo le ponga otro display. */
      [hidden] {
        display: none !important;
      }
      html {
        background: var(--ground);
      }
      body {
        background: var(--screen);
        color: var(--ink);
        font: 15px/1.5 var(--ui);
        margin: 0 auto;
        max-width: 40rem;
        min-height: 100dvh;
        padding: 0 1rem 1rem;
      }
      button {
        color: inherit;
        font: inherit;
        white-space: nowrap;
      }
      button:disabled {
        cursor: default;
      }
      input {
        background: var(--screen);
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        font: inherit;
        padding: 0.5rem 0.65rem;
      }
      input:focus {
        border-color: var(--accent);
        outline: 2px solid var(--accent-soft);
      }

      /* ── La cabecera: ◀ título ▶ ⚙ ── */
      .cabecera {
        align-items: center;
        border-bottom: 1px solid var(--rowline);
        display: flex;
        gap: 0.25rem;
        margin: 0 -1rem 0.75rem;
        min-height: 3.25rem;
        padding: 0 0.5rem;
      }
      .cabecera[hidden] {
        display: none;
      }
      .flecha {
        background: none;
        border: none;
        border-radius: 8px;
        color: var(--accent);
        cursor: pointer;
        font-size: 1.15rem;
        line-height: 1;
        padding: 0.55rem 0.65rem;
      }
      .flecha[aria-label="Configuración"] {
        color: var(--green);
      }
      .flecha:hover:not(:disabled) {
        background: var(--row);
      }
      .apagado,
      .flecha:disabled {
        color: var(--dim) !important;
      }
      .titulo {
        flex: 1;
        font-size: 1.15rem;
        font-weight: 650;
        letter-spacing: -0.01em;
        margin: 0;
        min-width: 0;
        overflow: hidden;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      input.titulo {
        background: var(--accent-soft);
        border: 1.5px solid var(--accent);
        border-radius: 8px;
        outline: none;
        padding: 0.3rem 0.6rem;
        text-align: left;
      }
      .titulo.renombrable {
        cursor: text;
      }

      /* ── Las listas como tarjetas ── */
      .notas,
      .ajustes {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .notas li,
      .ajustes > li {
        background: var(--row);
        border: 1px solid var(--rowline);
        border-radius: 10px;
        padding: 0.65rem 0.8rem;
      }
      .notas li {
        align-items: center;
        cursor: pointer;
        display: flex;
        font-weight: 500;
        gap: 0.6rem;
        /* La pulsación larga es de la app: ni selección de texto ni el menú de iOS. */
        -webkit-touch-callout: none;
        touch-action: manipulation;
        user-select: none;
      }
      .notas li:hover {
        border-color: var(--line);
      }
      .notas li:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      /* En selección: un círculo en cada fila, y el tick en las elegidas. */
      .notas.seleccionando li::before {
        border: 1.5px solid var(--dim);
        border-radius: 50%;
        content: "";
        flex: none;
        height: 1.05rem;
        width: 1.05rem;
      }
      .notas li.seleccionada {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      .notas.seleccionando li.seleccionada::before {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
        content: "✓";
        display: grid;
        font-size: 0.7rem;
        place-items: center;
      }
      ul.ajustes > li {
        align-items: center;
        display: flex;
        gap: 0.5rem;
        justify-content: space-between;
        padding: 0.45rem 0.6rem 0.45rem 0.8rem;
      }
      .fila {
        background: none;
        border: none;
        cursor: pointer;
        font-weight: 500;
        padding: 0.2rem 0;
        text-align: left;
        width: 100%;
      }
      .fila::after {
        color: var(--muted);
        content: "›";
        float: right;
      }

      /* ── Vacíos y avisos ── */
      .vacia {
        color: var(--muted);
        padding: 2rem 1rem;
        text-align: center;
      }
      .vacia button {
        background: none;
        border: 1px solid var(--line);
        border-radius: 99px;
        color: var(--green);
        cursor: pointer;
        padding: 0.4rem 1rem;
      }
      .aviso {
        background: var(--row);
        border: 1px solid var(--line);
        border-left: 4px solid #d08a00;
        border-radius: 10px;
        font-size: 0.9rem;
        margin-bottom: 0.75rem;
        padding: 0.25rem 1rem;
      }
      .aviso-guardado {
        border-left-color: var(--danger);
        position: sticky;
        top: 0.5rem;
        z-index: 2;
      }
      .aviso-guardado[hidden] {
        display: none;
      }
      .aviso .recargar {
        background: var(--accent);
        border: none;
        border-radius: 8px;
        color: var(--accent-ink);
        cursor: pointer;
        font-weight: 600;
        margin: 0 0 0.6rem;
        padding: 0.45rem 0.9rem;
      }
      /* El de ficheros ilegibles flota arriba y se difumina solo. */
      .aviso-temporal {
        animation: bajar 0.25s ease-out;
        box-shadow: 0 6px 20px rgb(0 0 0 / 0.3);
        cursor: pointer;
        left: 50%;
        max-width: calc(min(40rem, 100vw) - 2rem);
        position: fixed;
        top: 0.75rem;
        transform: translateX(-50%);
        transition: opacity 0.6s ease;
        width: 100%;
        z-index: 20;
      }
      .aviso-temporal.fuera {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes bajar {
        from {
          opacity: 0;
          transform: translate(-50%, -1rem);
        }
      }

      /* ── La configuración ── */
      h2 {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        margin: 1.25rem 0 0.5rem;
        text-transform: uppercase;
      }
      .crear {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.6rem;
      }
      .crear input {
        flex: 1;
        min-width: 0;
      }
      .crear button,
      section > div > button {
        background: none;
        border: none;
        color: var(--accent);
        cursor: pointer;
        font-weight: 600;
        padding: 0.45rem 0.6rem;
      }
      .acciones,
      .selector {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        padding: 0.5rem 0 0.15rem;
      }
      .acciones button,
      .selector button {
        background: var(--screen);
        border: 1px solid var(--rowline);
        border-radius: 8px;
        cursor: pointer;
        padding: 0.4rem 0.75rem;
      }
      .acciones button:hover,
      .selector button:hover {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      .acciones button:last-child {
        color: var(--danger);
      }
      .selector .grupo {
        color: var(--muted);
        flex-basis: 100%;
        font-family: var(--mono);
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        padding-top: 0.25rem;
        text-transform: uppercase;
      }
      .secundario {
        background: none !important;
        border-color: transparent !important;
        color: var(--muted) !important;
        cursor: pointer;
      }
      ul.ajustes .secundario {
        color: var(--danger) !important;
      }

      /* ── Las ventanas en ⚙: una fila de fichas que se desliza ── */
      .fichas {
        align-items: center;
        column-gap: 0.5rem;
        display: flex;
        overflow-x: auto;
        padding: 0.35rem 0.1rem 0.6rem;
        scrollbar-width: thin;
      }
      .fichas > ol {
        column-gap: 0.5rem;
        display: flex;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      /* Cada ventana, un móvil en pequeño: tamaño fijo, lo que no quepa se corta. */
      .ficha {
        background: var(--row);
        border: 1.5px solid var(--rowline);
        border-radius: 12px;
        cursor: grab;
        display: flex;
        flex: none;
        flex-direction: column;
        height: 7.5rem;
        overflow: hidden;
        padding: 0.9rem 0.45rem 0.2rem;
        position: relative;
        transition: transform 0.15s ease;
        width: 4.25rem;
        /* La pulsación larga arrastra: ni seleccionar texto ni el menú de iOS. */
        -webkit-touch-callout: none;
        user-select: none;
      }
      /* El altavoz de arriba, para que se lea como pantalla. */
      .ficha::before {
        background: var(--rowline);
        border-radius: 2px;
        content: "";
        height: 3px;
        left: 50%;
        position: absolute;
        top: 0.4rem;
        transform: translateX(-50%);
        width: 1.2rem;
      }
      .ficha .nombre {
        flex: 1;
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1.25;
        min-height: 0;
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .ficha .menu {
        align-self: flex-end;
        background: none;
        border: none;
        border-radius: 6px;
        color: var(--muted);
        cursor: pointer;
        flex: none;
        font-size: 1rem;
        line-height: 1;
        padding: 0.2rem 0.3rem;
      }
      .ficha .menu:hover {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .ficha.levantada {
        background: var(--accent-soft);
        border-color: var(--accent);
        box-shadow: 0 6px 16px rgb(0 0 0 / 0.25);
        cursor: grabbing;
        position: relative;
        transition: none;
        z-index: 1;
      }
      .fichas.arrastrando {
        cursor: grabbing;
      }
      .ficha-mas {
        background: var(--green);
        border: none;
        border-radius: 50%;
        color: #fff;
        cursor: pointer;
        flex: none;
        font-size: 1.3rem;
        height: 2.1rem;
        line-height: 1;
        width: 2.1rem;
      }
      .hoja-acciones {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .hoja-acciones > button {
        background: var(--row);
        border: 1px solid var(--rowline);
        border-radius: 8px;
        cursor: pointer;
        padding: 0.6rem 0.9rem;
        text-align: left;
      }
      .hoja-acciones > button.peligro {
        color: var(--danger);
      }
      .hoja-acciones > .hoja-nuevo {
        background: var(--green);
        border: none;
        color: #fff;
        text-align: center;
      }

      /* ── El «+» de la última ventana, en el sitio de ▶ ── */
      .flecha.agregar {
        align-items: center;
        background: var(--green);
        border-radius: 50%;
        color: #fff;
        display: inline-flex;
        font-size: 1.3rem;
        height: 2rem;
        justify-content: center;
        margin: 0 0.15rem;
        padding: 0;
        width: 2rem;
      }
      .flecha.agregar:hover:not(:disabled) {
        background: var(--green);
        filter: brightness(1.1);
      }
      .flecha.agregar:disabled {
        background: var(--dim);
        color: var(--screen) !important;
      }

      /* ── La hoja que sube desde abajo ── */
      .hoja-fondo {
        align-items: flex-end;
        background: rgb(0 0 0 / 0.45);
        display: flex;
        inset: 0;
        justify-content: center;
        position: fixed;
        z-index: 10;
      }
      .hoja {
        animation: subir 0.18s ease-out;
        background: var(--screen);
        border-radius: 16px 16px 0 0;
        box-shadow: 0 -6px 24px rgb(0 0 0 / 0.25);
        display: flex;
        flex-direction: column;
        max-height: 80dvh;
        max-width: 40rem;
        padding: 0.5rem 1rem calc(1rem + env(safe-area-inset-bottom));
        width: 100%;
      }
      .hoja::before {
        align-self: center;
        background: var(--line);
        border-radius: 2px;
        content: "";
        height: 4px;
        margin-bottom: 0.6rem;
        width: 2.5rem;
      }
      .hoja h2 {
        font-size: 1rem;
        margin: 0 0 0.5rem;
      }
      .hoja-cuerpo {
        overflow-y: auto;
      }
      .hoja-nuevo {
        background: var(--green);
        border: none;
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        font-weight: 600;
        padding: 0.55rem 0.9rem;
        width: 100%;
      }
      .hoja-pregunta {
        font-size: 1rem;
        margin: 0.25rem 0 1rem;
        text-align: center;
      }
      .hoja-peligro {
        background: var(--danger);
        border: none;
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        font-weight: 600;
        padding: 0.6rem 0.9rem;
        width: 100%;
      }
      .hoja .selector button {
        background: var(--row);
      }
      .hoja-cancelar {
        align-self: center;
        border: none;
        margin-top: 0.5rem;
        padding: 0.5rem 1rem;
      }
      @keyframes subir {
        from {
          transform: translateY(100%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hoja {
          animation: none;
        }
      }

      /* ── «+»: el botón flotante de nota nueva ── */
      .mas {
        background: var(--green);
        border: none;
        border-radius: 50%;
        bottom: 1.25rem;
        box-shadow: 0 4px 12px rgb(0 0 0 / 0.2);
        color: #fff;
        cursor: pointer;
        font-size: 1.6rem;
        height: 3.25rem;
        line-height: 1;
        position: fixed;
        right: max(1.25rem, calc((100vw - 40rem) / 2 + 1.25rem));
        width: 3.25rem;
        z-index: 1;
      }
      .mas[hidden] {
        display: none;
      }

      /* ── Las barras de abajo: selección y modo de escritura ── */
      .barra {
        align-items: center;
        background: var(--accent);
        bottom: 0;
        color: var(--accent-ink);
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        margin: 0.75rem -1rem 0;
        padding: 0.55rem 0.75rem;
        position: sticky;
      }
      /* La de selección va fija al pie de la pantalla, como la del modo en la nota. */
      .notas ~ .barra {
        bottom: 0;
        left: 50%;
        margin: 0;
        max-width: 40rem;
        position: fixed;
        transform: translateX(-50%);
        width: 100%;
        z-index: 2;
      }
      .barra > span {
        flex: 1;
        font-weight: 600;
      }
      .barra button {
        background: none;
        border: none;
        border-radius: 8px;
        color: var(--accent-ink);
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
        padding: 0.45rem 0.7rem;
      }
      .barra button:disabled {
        opacity: 0.45;
      }
      .barra button.activo {
        background: var(--accent-ink);
        color: var(--accent);
      }
      /* Anidar armado: tiene que verse, porque actúa sobre la línea que aún no existe. */
      .barra button.anidar.activo {
        background: none;
        color: var(--accent-ink);
        outline: 1.5px dashed var(--accent-ink);
        outline-offset: -2px;
      }
      .barra .selector {
        flex-basis: 100%;
      }
      .barra .selector button {
        background: var(--accent-ink);
        border-color: transparent;
        color: var(--accent);
      }
      .barra-modo .salir {
        margin-left: auto;
      }

      /* ── La nota ── */
      .vista-nota {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
      }
      /* En una ventana, bajo la cabecera de la vista ventanas: se descuenta su alto. */
      .vista-nota.en-ventana {
        min-height: calc(100dvh - 4rem);
      }
      .vista-nota.en-ventana:empty {
        display: none;
      }
      .contenido {
        flex: 1;
        padding: 0.25rem 0 1rem;
      }
      .linea {
        align-items: baseline;
        display: flex;
        flex-wrap: wrap;
        line-height: 1.45;
        padding: 0.12rem 0;
      }
      .linea > .texto {
        caret-color: var(--accent);
        flex: 1;
        min-height: 1.45em;
        min-width: 2rem;
        outline: none;
        padding: 0.12rem 0;
        tab-size: 4;
        white-space: pre-wrap;
        word-break: break-word;
      }
      /* La casilla: una caja que se rellena con el ✓. */
      .marca {
        align-self: center;
        background: none;
        border: 1.5px solid var(--muted);
        border-radius: 4px;
        color: var(--accent-ink);
        cursor: pointer;
        display: grid;
        flex: none;
        font-size: 0.72rem;
        font-weight: 700;
        height: 1.05rem;
        line-height: 1;
        margin-right: 0.55rem;
        padding: 0;
        place-items: center;
        width: 1.05rem;
      }
      .linea.marcada > .marca {
        background: var(--accent);
        border-color: var(--accent);
      }
      .linea.marcada > .texto {
        color: var(--muted);
        text-decoration: line-through;
      }
      .hijas {
        flex-basis: 100%;
        padding-left: 1.6rem;
      }
      .empezar {
        cursor: text;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <main id="app"><p>Cargando…</p></main>
  </body>
</html>
